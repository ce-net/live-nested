name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc 2.35, so the binaries run on Debian 12 nodes; both runners allow user namespaces
          - os: ubuntu-22.04-arm
            box: bwrap
          - os: ubuntu-22.04
            box: bwrap
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: bubblewrap, with unprivileged user namespaces allowed for it
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true
      - name: chains and the whole tree in boxes
        run: NEST_BOX=${{ matrix.box }} cargo test --release --locked -- --nocapture
      - name: the whole tree without boxes (none)
        run: NEST_BOX=none cargo test --release --locked --test tree
      - name: binaries
        run: cargo build --release --locked && mkdir -p out && cp target/release/nest target/release/notes out/
      - uses: actions/upload-artifact@v4
        with:
          name: nest-${{ runner.arch }}
          path: out/
  pages:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
